devcapsule-schema-version = 2

[project]
name = "chessclub-website"
slug = "chessclub-website"
creator = "https://github.com/ccozianu"
mount = "/workspace/chessclub-website"

[capabilities]
required = ["antigravity-agent", "claude-code-agent", "codex-agent", "node"]

[recommendations]
ide = "frontend-ide"

[host.docker.mode.recommended]
value = "host-socket"
justification = "need access to host"

[host.network.mode.recommended]
value = "host"
justification = "easier this way"

[host.browser.host-open.recommended]
value = true
justification = "ease of use"

# The project's workflow choice.

[workflow]
definition = "devcapsule"
version = "0.3.1"
mode = "multiple-streams"
